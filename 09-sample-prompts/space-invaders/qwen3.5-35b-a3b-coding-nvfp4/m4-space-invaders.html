<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <style>
        /* CSS Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #33ff33;
            background-color: #000000;
            display: block;
        }

        #scoreBoard {
            color: #33ff33;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #33ff33;
        }

        #gameOverScreen, #youWinScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        #gameOverScreen h1, #youWinScreen h1 {
            color: #ff3333;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff3333;
        }

        #youWinScreen h1 {
            color: #33ff33;
            text-shadow: 0 0 10px #33ff33;
        }

        #restartBtn {
            background-color: #33ff33;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }

        #restartBtn:hover {
            background-color: #66ff66;
        }

        #instructions {
            color: #666666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreBoard">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p>The aliens have reached Earth!</p>
            <button id="restartBtn">Play Again</button>
        </div>
        <div id="youWinScreen">
            <h1>YOU WIN!</h1>
            <p>All aliens destroyed!</p>
            <button id="restartBtn">Play Again</button>
        </div>
        <div id="instructions">
            Use Left/Right Arrow or A/D to move | Space to shoot
        </div>
    </div>

    <script>
        /**
         * Space Invaders Game
         * A complete implementation using vanilla JavaScript and HTML5 Canvas
         */

        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            CANVAS_WIDTH: 800,
            CANVAS_HEIGHT: 600,
            PLAYER_WIDTH: 40,
            PLAYER_HEIGHT: 20,
            PLAYER_SPEED: 5,
            BULLET_WIDTH: 4,
            BULLET_HEIGHT: 10,
            BULLET_SPEED: 7,
            ALIEN_WIDTH: 30,
            ALIEN_HEIGHT: 20,
            ALIEN_PADDING: 15,
            ALIEN_ROWS: 5,
            ALIEN_COLS: 10,
            ALIEN_START_SPEED: 1,
            ALIEN_DROP_DISTANCE: 20,
            PLAYER_LIVES: 3
        };

        // ============================================
        // GAME STATE
        // ============================================
        let canvas, ctx;
        let score, lives;
        let player;
        let aliens = [];
        let bullets = [];
        let alienDirection = 1; // 1 = right, -1 = left
        let alienSpeed = CONFIG.ALIEN_START_SPEED;
        let isGameOver = false;
        let isYouWin = false;
        let keysPressed = {};

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Get canvas and context
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Set canvas size
            canvas.width = CONFIG.CANVAS_WIDTH;
            canvas.height = CONFIG.CANVAS_HEIGHT;

            // Handle window resize
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Initialize game state
            resetGame();

            // Set up event listeners
            setupEventListeners();

            // Start game loop
            requestAnimationFrame(gameLoop);
        }

        // Resize canvas to fit browser window while maintaining aspect ratio
        function resizeCanvas() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 150;

            let scale = Math.min(maxWidth / CONFIG.CANVAS_WIDTH, maxHeight / CONFIG.CANVAS_HEIGHT);
            scale = Math.min(scale, 1.5); // Limit maximum scale

            canvas.style.width = (CONFIG.CANVAS_WIDTH * scale) + 'px';
            canvas.style.height = (CONFIG.CANVAS_HEIGHT * scale) + 'px';
            canvas.width = CONFIG.CANVAS_WIDTH;
            canvas.height = CONFIG.CANVAS_HEIGHT;
        }

        // ============================================
        // GAME RESET
        // ============================================
        function resetGame() {
            // Reset score and lives
            score = 0;
            lives = CONFIG.PLAYER_LIVES;
            updateScoreDisplay();

            // Create player
            player = {
                x: CONFIG.CANVAS_WIDTH / 2 - CONFIG.PLAYER_WIDTH / 2,
                y: CONFIG.CANVAS_HEIGHT - 50,
                width: CONFIG.PLAYER_WIDTH,
                height: CONFIG.PLAYER_HEIGHT
            };

            // Create aliens in grid formation
            createAliens();

            // Reset bullets
            bullets = [];

            // Reset alien movement
            alienDirection = 1;
            alienSpeed = CONFIG.ALIEN_START_SPEED;

            // Reset game state
            isGameOver = false;
            isYouWin = false;

            // Hide game over screens
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('youWinScreen').style.display = 'none';
        }

        // Create alien grid
        function createAliens() {
            aliens = [];
            const totalAlienWidth = CONFIG.ALIEN_COLS * (CONFIG.ALIEN_WIDTH + CONFIG.ALIEN_PADDING);
            const startX = (CONFIG.CANVAS_WIDTH - totalAlienWidth) / 2;

            for (let row = 0; row < CONFIG.ALIEN_ROWS; row++) {
                for (let col = 0; col < CONFIG.ALIEN_COLS; col++) {
                    aliens.push({
                        x: startX + col * (CONFIG.ALIEN_WIDTH + CONFIG.ALIEN_PADDING),
                        y: 50 + row * (CONFIG.ALIEN_HEIGHT + CONFIG.ALIEN_PADDING),
                        width: CONFIG.ALIEN_WIDTH,
                        height: CONFIG.ALIEN_HEIGHT,
                        row: row,
                        col: col
                    });
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Keyboard events for movement and shooting
            document.addEventListener('keydown', (e) => {
                keysPressed[e.code] = true;

                // Prevent scrolling with arrow keys and space
                if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }

                // Fire bullet on space press (if game is active)
                if (e.code === 'Space' && !isGameOver && !isYouWin) {
                    fireBullet();
                }
            });

            document.addEventListener('keyup', (e) => {
                keysPressed[e.code] = false;
            });

            // Restart button
            document.getElementById('restartBtn').addEventListener('click', resetGame);
        }

        // ============================================
        // PLAYER CONTROLS
        // ============================================
        function updatePlayer() {
            if (isGameOver || isYouWin) return;

            // Move left (ArrowLeft or A)
            if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) {
                player.x = Math.max(0, player.x - CONFIG.PLAYER_SPEED);
            }

            // Move right (ArrowRight or D)
            if (keysPressed['ArrowRight'] || keysPressed['KeyD']) {
                player.x = Math.min(
                    CONFIG.CANVAS_WIDTH - CONFIG.PLAYER_WIDTH,
                    player.x + CONFIG.PLAYER_SPEED
                );
            }
        }

        // ============================================
        // BULLET SYSTEM
        // ============================================
        function fireBullet() {
            bullets.push({
                x: player.x + CONFIG.PLAYER_WIDTH / 2 - CONFIG.BULLET_WIDTH / 2,
                y: player.y,
                width: CONFIG.BULLET_WIDTH,
                height: CONFIG.BULLET_HEIGHT
            });
        }

        function updateBullets() {
            if (isGameOver || isYouWin) return;

            // Update bullet positions
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= CONFIG.BULLET_SPEED;

                // Remove bullets that go off screen
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        // ============================================
        // ALIEN MOVEMENT
        // ============================================
        function updateAliens() {
            if (isGameOver || isYouWin) return;

            let hitEdge = false;

            // Check if any alien has hit the edge
            for (const alien of aliens) {
                if (
                    (alienDirection === 1 && alien.x + alien.width >= CONFIG.CANVAS_WIDTH - 10) ||
                    (alienDirection === -1 && alien.x <= 10)
                ) {
                    hitEdge = true;
                    break;
                }
            }

            // If edge hit, move down and reverse direction
            if (hitEdge) {
                alienDirection *= -1;

                for (const alien of aliens) {
                    alien.y += CONFIG.ALIEN_DROP_DISTANCE;
                }
            } else {
                // Move horizontally
                for (const alien of aliens) {
                    alien.x += alienSpeed * alienDirection;
                }
            }

            // Increase speed as fewer aliens remain
            updateAlienSpeed();

            // Check if aliens reached the bottom
            for (const alien of aliens) {
                if (alien.y + alien.height >= player.y) {
                    gameOver();
                    break;
                }
            }
        }

        // Update alien speed based on remaining count
        function updateAlienSpeed() {
            const remainingRatio = aliens.length / (CONFIG.ALIEN_ROWS * CONFIG.ALIEN_COLS);
            alienSpeed = CONFIG.ALIEN_START_SPEED + (1 - remainingRatio) * 3;
        }

        // ============================================
        // COLLISION DETECTION
        // ============================================
        function checkCollisions() {
            if (isGameOver || isYouWin) return;

            // Check bullet-alien collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = aliens.length - 1; j >= 0; j--) {
                    if (isColliding(bullets[i], aliens[j])) {
                        // Remove bullet and alien
                        bullets.splice(i, 1);
                        aliens.splice(j, 1);

                        // Update score
                        score += 10;
                        updateScoreDisplay();

                        // Check win condition
                        if (aliens.length === 0) {
                            youWin();
                        }
                        break;
                    }
                }
            }
        }

        // Check if two rectangles are colliding
        function isColliding(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // ============================================
        // GAME STATE MANAGEMENT
        // ============================================
        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        function youWin() {
            isYouWin = true;
            document.getElementById('youWinScreen').style.display = 'block';
        }

        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw player ship
            drawPlayer();

            // Draw aliens
            drawAliens();

            // Draw bullets
            drawBullets();

            // Draw lives indicator
            drawLives();
        }

        function drawPlayer() {
            ctx.fillStyle = '#33ff33';

            // Draw a simple spaceship shape
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height - 5);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Add glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#33ff33';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawAliens() {
            for (const alien of aliens) {
                ctx.fillStyle = '#ff3333';

                // Draw alien shape (inverted U with eyes)
                const x = alien.x;
                const y = alien.y;
                const w = alien.width;
                const h = alien.height;

                // Main body
                ctx.fillRect(x + 2, y + 2, w - 4, h - 6);

                // Eyes
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 6, y + 6, 4, 4);
                ctx.fillRect(x + w - 10, y + 6, 4, 4);

                // Legs
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(x + 4, y + h - 4, 4, 4);
                ctx.fillRect(x + w - 8, y + h - 4, 4, 4);

                // Add glow effect
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ff3333';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function drawBullets() {
            ctx.fillStyle = '#ffffff';
            for (const bullet of bullets) {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }
        }

        function drawLives() {
            ctx.fillStyle = '#33ff33';
            ctx.font = '16px Courier New';
            ctx.fillText(`Lives: ${lives}`, 10, 30);
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function gameLoop() {
            // Update game state
            updatePlayer();
            updateBullets();
            updateAliens();
            checkCollisions();

            // Draw everything
            draw();

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // START GAME
        // ============================================
        window.onload = init;
    </script>
</body>
</html>
