<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders Clone</title>
<style>
  body,html{margin:0;padding:0;overflow:hidden;background:#000;}
  canvas{display:block;width:100vw;height:100vh;background:#000;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/* ==========================
   Space Invaders Clone
   Vanilla JS + Canvas
   ========================== */

/* ---------- Config ----------
   All constants are in pixels or seconds.
   Feel free to tweak them for a different feel.  */
const CONFIG = {
  player: { width:40, height:20, speed:300 },
  bullet:{ width:4, height:10, speed:500 },
  alien :{ width:30, height:20,
           rows:5, cols:10,
           padX:20, padY:15,
           baseSpeed:50, descend:30 },
  scorePerAlien:10
};

/* ---------- Canvas ----------
   The canvas will resize with the window. */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);

/* ---------- Game Objects ----------
   Player, Bullet and Alien classes. */
class Player {
  constructor(){ this.w=CONFIG.player.width; this.h=CONFIG.player.height;
    this.x=(canvas.width-this.w)/2; this.y=canvas.height-this.h-10;
    this.speed=CONFIG.player.speed; }
  update(dt){ let dir=0; if(keys.left)dir--; if(keys.right)dir++; this.x+=dir*this.speed*dt;
    this.x=Math.max(0,Math.min(canvas.width-this.w,this.x)); }
  draw(){ ctx.fillStyle='#0f0'; ctx.fillRect(this.x,this.y,this.w,this.h); }
}
class Bullet {
  constructor(x,y){ this.x=x; this.y=y; this.w=CONFIG.bullet.width; this.h=CONFIG.bullet.height;
    this.speed=CONFIG.bullet.speed; }
  update(dt){ this.y-=this.speed*dt; }
  draw(){ ctx.fillStyle='#ff0'; ctx.fillRect(this.x,this.y,this.w,this.h); }
}
class Alien {
  constructor(x,y){ this.x=x; this.y=y; this.w=CONFIG.alien.width; this.h=CONFIG.alien.height;
    this.alive=true; }
  draw(){ if(!this.alive)return; ctx.fillStyle='#f00'; ctx.fillRect(this.x,this.y,this.w,this.h); }
}

/* ---------- Game State ----------
   Arrays, score and state flags. */
let player = new Player();
let bullets=[];
let aliens=[];
let score=0;
let state='playing'; // 'playing', 'gameover', 'win'
const keys={left:false,right:false};

/* ---------- Utility ----------
   Clamp a value between min and max. */
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

/* ---------- Input ----------
   Arrow keys or A/D for movement; Space for shooting. */
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  if(e.code==='Space' && state==='playing'){
    bullets.push(new Bullet(player.x+player.w/2-2, player.y));
  }
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});

/* ---------- Create Aliens ----------
   Called once at start. */
function createAliens(){
  const {rows,cols,padX,padY} = CONFIG.alien;
  const totalW=cols*CONFIG.alien.width+(cols-1)*padX;
  const startX=(canvas.width-totalW)/2, startY=50;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=startX+c*(CONFIG.alien.width+padX);
      const y=startY+r*(CONFIG.alien.height+padY);
      aliens.push(new Alien(x,y));
    }
  }
}

/* ---------- Game Loop ----------
   Handles updates and rendering. */
let lastTime=0;
function loop(time){
  const dt=(time-lastTime)/1000; lastTime=time;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(state==='playing'){
    player.update(dt);
    bullets.forEach(b=>b.update(dt));
    moveAliens(dt);
    handleCollisions();
  }
  player.draw();
  bullets.forEach(b=>b.draw());
  aliens.forEach(a=>a.draw());
  drawScore();
  if(state!=='playing')drawOverlay();
  requestAnimationFrame(loop);
}

/* ---------- Alien Movement ----------
   Horizontal movement and descent. */
let alienDir=1; // 1:right, -1:left
function moveAliens(dt){
  const alive=aliens.filter(a=>a.alive);
  if(alive.length===0)return;
  const base=CONFIG.alien.baseSpeed;
  const factor=Math.max(1,alive.length/(CONFIG.alien.rows*CONFIG.alien.cols));
  const speed=base*factor;
  let moveX=alienDir*speed*dt;

  const leftMost=Math.min(...alive.map(a=>a.x));
  const rightMost=Math.max(...alive.map(a=>a.x+a.w));

  if(rightMost+moveX>canvas.width||leftMost+moveX<0){
    alienDir*=-1;
    alive.forEach(a=>a.y+=CONFIG.alien.descend);
  }else{
    alive.forEach(a=>a.x+=moveX);
  }
}

/* ---------- Collision Handling ----------
   Bullets vs aliens and alien vs player. */
function handleCollisions(){
  bullets.forEach(b=>{
    aliens.forEach(a=>{
      if(!a.alive)return;
      if(b.x<b.x+a.w&&b.y+b.h>a.y&&b.y<b.y+a.h){
        a.alive=false; b.y=-10; score+=CONFIG.scorePerAlien;
      }
    });
  });

  // Remove offscreen bullets
  for(let i=bullets.length-1;i>=0;i--) if(bullets[i].y+bullets[i].h<0) bullets.splice(i,1);

  // Alien reaching bottom or hitting player
  aliens.forEach(a=>{
    if(!a.alive)return;
    if(a.y+a.h>=player.y){ state='gameover'; }
    if(a.x<a.x+player.w&&a.x+a.w>player.x&&a.y+a.h>=player.y){
      state='gameover';
    }
  });

  // Win condition
  if(aliens.every(a=>!a.alive)) state='win';
}

/* ---------- UI ----------
   Score and overlay text. */
function drawScore(){
  ctx.fillStyle='#fff';
  ctx.font='20px monospace';
  ctx.textAlign='left';
  ctx.fillText(`Score: ${score}`,10,30);
}
function drawOverlay(){
  const msg=state==='win'?'You Win! Press R to Restart':'Game Over! Press R to Restart';
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';
  ctx.font='48px monospace';
  ctx.textAlign='center';
  ctx.fillText(msg,canvas.width/2,canvas.height/2);
}

/* ---------- Restart ----------
   Press R to reset the game. */
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){ init(); }
});

/* ---------- Init ----------
   Reset all game variables. */
function init(){
  player=new Player();
  bullets=[];
  aliens=[];
  score=0;
  state='playing';
  createAliens();
}

/* ---------- Start ----------
   Kick off the game. */
init(); requestAnimationFrame(loop);
</script>
</body>
</html>
