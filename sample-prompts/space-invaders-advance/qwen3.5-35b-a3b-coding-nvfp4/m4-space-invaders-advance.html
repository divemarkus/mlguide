<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Retro Arcade</title>
    <style>
        /*
         * CSS STYLING
         * Retro pixel-art aesthetic with responsive canvas
         */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #gameCanvas {
            display: block;
            imageRendering: pixelated; /* Essential for crisp pixel art */
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
            filter: brightness(1.05) contrast(1.1);
        }

        /* CRT screen effect overlay */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 10;
        }

        /* Subtle screen curvature vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            z-index: 9;
        }
    </style>
</head>

    /**
     * AudioController handles all sound effects using Web Audio API
     * Generates retro 8-bit style sounds programmatically
     */
    class AudioController {
        constructor() {
            this.audioContext = null;
            this.initialized = false;
        }

        /**
         * Initialize audio context (must be called after user interaction)
         */
        init() {
            if (!this.initialized) {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.warn('Web Audio API not supported');
                }
            }
        }

        /**
         * Play a shooting sound (retro laser effect)
         */
        playShoot() {
            if (!this.initialized || !this.audioContext) return;

            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);

            // Retro laser sound: descending pitch
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(110, this.audioContext.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);

            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.1);
        }

        /**
         * Play an alien hit sound (explosion effect)
         */
        playAlienHit() {
            if (!this.initialized || !this.audioContext) return;

            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);

            // Retro explosion: descending frequency
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(50, this.audioContext.currentTime + 0.15);

            gainNode.gain.setValueAtTime(0.15, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);

            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.15);
        }

        /**
         * Play a player hit sound (damage effect)
         */
        playPlayerHit() {
            if (!this.initialized || !this.audioContext) return;

            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);

            // Damage sound: low frequency with modulation
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(150, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, this.audioContext.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);

            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.3);
        }

        /**
         * Play a game over sound
         */
        playGameOver() {
            if (!this.initialized || !this.audioContext) return;

            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);

            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(400, this.audioContext.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, this.audioContext.currentTime + 1);

            gainNode.gain.setValueAtTime(0.15, this.audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 1);

            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 1);
        }

        /**
         * Play a win sound
         */
        playWin() {
            if (!this.initialized || !this.audioContext) return;

            // Play a simple victory melody
            const notes = [523, 659, 784, 1047];
            notes.forEach((freq, i) => {
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(freq, this.audioContext.currentTime + i * 0.1);

                gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime + i * 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + i * 0.1 + 0.2);

                oscillator.start(this.audioContext.currentTime + i * 0.1);
                oscillator.stop(this.audioContext.currentTime + i * 0.1 + 0.2);
            });
        }
    }

    /**
     * SpriteCache handles pre-rendering of all game sprites
     * This is the key optimization - sprites are drawn once
     * and then simply blitted to the canvas each frame
     */
    class SpriteCache {
        constructor() {
            this.playerCanvas = null;
            this.alienCanvases = [null, null, null]; // Three alien types
            this.explosionCanvases = [null, null, null, null]; // Four explosion frames
        }

        /**
         * Create a canvas from a sprite array
         * @param {string[]} sprite - Array of strings representing the sprite
         * @param {number} pixelScale - Scale factor for each pixel
         * @returns {HTMLCanvasElement} - Pre-rendered canvas
         */
        createCanvasFromSprite(sprite, pixelScale = 4) {
            const width = sprite[0].length * pixelScale;
            const height = sprite.length * pixelScale;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            sprite.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    if (row[x] === '#') {
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(x * pixelScale, y * pixelScale, pixelScale, pixelScale);
                    }
                }
            });

            return canvas;
        }

        /**
         * Create a canvas from a sprite array with custom colors
         * @param {string[]} sprite - Array of strings representing the sprite
         * @param {string[]} colors - Array of colors for different parts
         * @param {number} pixelScale - Scale factor for each pixel
         * @returns {HTMLCanvasElement} - Pre-rendered canvas
         */
        createCanvasFromSpriteWithColors(sprite, colors = ['#00ff00'], pixelScale = 4) {
            const width = sprite[0].length * pixelScale;
            const height = sprite.length * pixelScale;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            sprite.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    if (row[x] === '#') {
                        // Use first color for now (can be extended for multi-color)
                        ctx.fillStyle = colors[0];
                        ctx.fillRect(x * pixelScale, y * pixelScale, pixelScale, pixelScale);
                    }
                }
            });

            return canvas;
        }

        /**
         * Initialize all sprite canvases
         */
        init() {
            // Create player sprite
            this.playerCanvas = this.createCanvasFromSprite(PLAYER_SPRITE, 4);

            // Create alien sprites with different colors
            this.alienCanvases[0] = this.createCanvasFromSpriteWithColors(ALIEN_SPRITE_1, ['#ff00ff']);
            this.alienCanvases[1] = this.createCanvasFromSpriteWithColors(ALIEN_SPRITE_2, ['#00ffff']);
            this.alienCanvases[2] = this.createCanvasFromSpriteWithColors(ALIEN_SPRITE_3, ['#ff8800']);

            // Create explosion frames with varying colors
            const explosionColors = [
                ['#ff6600'], // Orange-red
                ['#ffaa00'], // Yellow-orange
                ['#ffff00'], // Yellow
                ['#ffffff'], // White
            ];

            this.explosionCanvases = EXPLOSION_FRAMES.map((frame, i) => {
                return this.createCanvasFromSpriteWithColors(frame, explosionColors[i]);
            });
        }

        /**
         * Get the player sprite canvas
         */
        getPlayerSprite() {
            return this.playerCanvas;
        }

        /**
         * Get an alien sprite canvas by type
         */
        getAlienSprite(type) {
            return this.alienCanvases[type % 3];
        }

        /**
         * Get an explosion frame canvas
         */
        getExplosionFrame(frameIndex) {
            return this.explosionCanvases[Math.min(frameIndex, 3)];
        }
    }

    // ============================================
    // STARFIELD BACKGROUND
    // ============================================

    /**
     * Starfield class handles the retro starfield background
     * Optimized to update only every N frames
     */
    class Starfield {
        constructor(canvasWidth, canvasHeight) {
            this.stars = [];
            this.canvasWidth = canvasWidth;
            this.canvasHeight = canvasHeight;
            this.updateCounter = 0;

            // Initialize random stars
            for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
                this.stars.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    size: Math.random() * 2 + 1,
                    baseBrightness: Math.random(),
                });
            }
        }

        /**
         * Update star positions (only every few frames for performance)
         */
        update() {
            this.updateCounter++;
            if (this.updateCounter < CONFIG.STAR_UPDATE_INTERVAL) {
                return;
            }
            this.updateCounter = 0;

            this.stars.forEach(star => {
                star.y += 0.3;
                if (star.y > this.canvasHeight) {
                    star.y = 0;
                }
            });
        }

        /**
         * Draw the starfield with simple rendering
         */
        draw(ctx) {
            ctx.fillStyle = '#ffffff';
            this.stars.forEach(star => {
                // Simple brightness variation using sine wave
                const brightness = 0.5 + Math.sin(Date.now() * 0.002 + star.x) * 0.3;
                const alpha = 0.3 + brightness * 0.7;
                ctx.globalAlpha = alpha;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;
        }
    }

    // ============================================
    // PLAYER CLASS
    // ============================================

    /**
     * Player class represents the player's spaceship
     * Uses cached sprite for fast rendering
     */
    class Player {
        constructor(canvasWidth, canvasHeight, spriteCache) {
            this.width = CONFIG.PLAYER_WIDTH;
            this.height = CONFIG.PLAYER_HEIGHT;
            this.x = canvasWidth / 2 - this.width / 2;
            this.y = canvasHeight - this.height - 20;
            this.speed = CONFIG.PLAYER_SPEED;
            this.direction = 0; // -1 for left, 1 for right, 0 for stationary
            this.lastShotTime = 0;
            this.bulletCooldown = CONFIG.BULLET_COOLDOWN;
            this.isHit = false;
            this.hitTimer = 0;
            this.spriteCache = spriteCache;
        }

        /**
         * Update player position based on input
         */
        update(deltaTime) {
            this.x += this.direction * this.speed * deltaTime;

            // Clamp to canvas bounds
            this.x = Math.max(0, Math.min(this.x, CONFIG.CANVAS_WIDTH - this.width));

            // Handle hit state
            if (this.isHit) {
                this.hitTimer -= deltaTime;
                if (this.hitTimer <= 0) {
                    this.isHit = false;
                }
            }
        }

        /**
         * Fire a bullet if cooldown has passed
         */
        shoot(now) {
            if (now - this.lastShotTime >= this.bulletCooldown) {
                this.lastShotTime = now;
                return new Bullet(this.x + this.width / 2 - CONFIG.BULLET_WIDTH / 2, this.y);
            }
            return null;
        }

        /**
         * Mark player as hit
         */
        hit() {
            this.isHit = true;
            this.hitTimer = 1.5;
        }

        /**
         * Draw the player ship using cached sprite
         */
        draw(ctx) {
            ctx.save();

            // Draw player sprite from cache
            const sprite = this.spriteCache.getPlayerSprite();
            if (sprite) {
                if (this.isHit && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                ctx.drawImage(sprite, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        /**
         * Rectangle collision detection helper
         */
        getBounds() {
            return {
                x: this.x,
                y: this.y,
                width: this.width,
                height: this.height,
            };
        }
    }

    // ============================================
    // BULLET CLASS
    // ============================================

    /**
     * Bullet class represents a player's laser
     * Optimized for fast rendering
     */
    class Bullet {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = CONFIG.BULLET_WIDTH;
            this.height = CONFIG.BULLET_HEIGHT;
            this.speed = CONFIG.BULLET_SPEED;
            this.active = true;
        }

        /**
         * Update bullet position
         */
        update(deltaTime) {
            this.y -= this.speed * deltaTime;

            // Deactivate if off screen
            if (this.y < -this.height) {
                this.active = false;
            }
        }

        /**
         * Draw the bullet with glow effect
         */
        draw(ctx) {
            // Main bullet body
            ctx.fillStyle = CONFIG.BULLET_COLOR;
            ctx.fillRect(this.x, this.y, this.width, this.height);

            // Inner glow (simplified - single fill)
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(this.x + 1, this.y + 2, this.width - 2, this.height - 4);
        }

        /**
         * Rectangle collision detection helper
         */
        getBounds() {
            return {
                x: this.x,
                y: this.y,
                width: this.width,
                height: this.height,
            };
        }
    }

    // ============================================
    // ALIEN CLASS
    // ============================================

    /**
     * Alien class represents an alien invader
     * Uses cached sprite for fast rendering
     */
    class Alien {
        constructor(x, y, spriteType, spriteCache) {
            this.x = x;
            this.y = y;
            this.width = CONFIG.ALIEN_WIDTH;
            this.height = CONFIG.ALIEN_HEIGHT;
            this.spriteType = spriteType;
            this.active = true;
            this.animationFrame = 0;
            this.originalX = x;
            this.spriteCache = spriteCache;
        }

        /**
         * Update alien position and animation
         */
        update(deltaTime, alienSpeed) {
            this.x += alienSpeed * deltaTime;

            // Animate (wobble effect) - using frame counter instead of Date.now()
            this.animationFrame = Math.floor(Date.now() / 150) % 2;
        }

        /**
         * Draw the alien using cached sprite
         */
        draw(ctx) {
            ctx.save();

            // Get sprite from cache
            const sprite = this.spriteCache.getAlienSprite(this.spriteType);
            if (sprite) {
                // Wobble animation
                const offsetX = this.animationFrame === 0 ? 1 : -1;
                ctx.drawImage(sprite, this.x + offsetX, this.y);
            }

            ctx.restore();
        }

        /**
         * Rectangle collision detection helper
         */
        getBounds() {
            return {
                x: this.x,
                y: this.y,
                width: this.width,
                height: this.height,
            };
        }
    }

    // ============================================
    // EXPLOSION PARTICLE CLASS
    // ============================================

    /**
     * ExplosionParticle represents particles from an explosion
     * Uses cached explosion frames for rendering
     */
    class ExplosionParticle {
        constructor(x, y, spriteCache) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.life = 1.0;
            this.decay = 0.03;
            this.size = Math.random() * 8 + 4;
            this.spriteCache = spriteCache;
            this.frame = 0;
        }

        /**
         * Update particle position and life
         */
        update(deltaTime) {
            this.x += this.vx * deltaTime;
            this.y += this.vy * deltaTime;
            this.life -= this.decay * deltaTime;

            // Advance animation frame
            this.frame = Math.floor((1.0 - this.life) * 3);
        }

        /**
         * Draw the particle using cached explosion frame
         */
        draw(ctx) {
            if (this.life <= 0) return;

            const frameIndex = Math.min(this.frame, 3);
            const sprite = this.spriteCache.getExplosionFrame(frameIndex);

            if (sprite) {
                ctx.globalAlpha = this.life * 0.8;
                const scale = this.size / 8; // Scale the sprite
                const scaledWidth = sprite.width * scale;
                const scaledHeight = sprite.height * scale;
                ctx.drawImage(sprite, this.x - scaledWidth / 2, this.y - scaledHeight / 2, scaledWidth, scaledHeight);
            } else {
                // Fallback to simple circle
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }
    }

    // ============================================
    // ALIEN GROUP CLASS
    // ============================================

    /**
     * AlienGroup manages all aliens in the game
     */
    class AlienGroup {
        constructor(canvasWidth, canvasHeight, spriteCache) {
            this.canvasWidth = canvasWidth;
            this.canvasHeight = canvasHeight;
            this.aliens = [];
            this.direction = 1; // 1 for right, -1 for left
            this.speed = CONFIG.ALIEN_START_SPEED;
            this.moveDown = false;
            this.spriteCache = spriteCache;

            this.initializeAliens();
        }

        /**
         * Initialize the alien grid
         */
        initializeAliens() {
            const startX = 50;
            const startY = 50;

            for (let row = 0; row < CONFIG.ALIEN_ROWS; row++) {
                for (let col = 0; col < CONFIG.ALIEN_COLS; col++) {
                    const x = startX + col * (CONFIG.ALIEN_WIDTH + CONFIG.ALIEN_PADDING);
                    const y = startY + row * (CONFIG.ALIEN_HEIGHT + CONFIG.ALIEN_PADDING);
                    // Use 3 alien types for more variety
                    const spriteType = (row + col) % 3;
                    this.aliens.push(new Alien(x, y, spriteType, this.spriteCache));
                }
            }
        }

        /**
         * Update all aliens
         */
        update(deltaTime) {
            if (this.moveDown) {
                this.aliens.forEach(alien => {
                    alien.y += CONFIG.ALIEN_DROP_DISTANCE;
                });
                this.moveDown = false;
            }

            this.aliens.forEach(alien => {
                alien.update(deltaTime, this.direction * this.speed);
            });
        }

        /**
         * Move aliens to the edge and reverse direction
         */
        moveTowardsEdge() {
            let edgeReached = false;
            const edgeMargin = 10;

            this.aliens.forEach(alien => {
                if (this.direction === 1) {
                    if (alien.x + alien.width > this.canvasWidth - edgeMargin) {
                        edgeReached = true;
                    }
                } else {
                    if (alien.x < edgeMargin) {
                        edgeReached = true;
                    }
                }
            });

            if (edgeReached) {
                this.direction *= -1;
                this.moveDown = true;
            }
        }

        /**
         * Check for collision with a bullet
         */
        checkCollision(bullet) {
            for (let alien of this.aliens) {
                if (!alien.active) continue;

                if (this.rectCollision(bullet, alien)) {
                    alien.active = false;
                    return alien;
                }
            }
            return null;
        }

        /**
         * Rectangle collision detection
         */
        rectCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        /**
         * Get remaining aliens count
         */
        getRemainingCount() {
            return this.aliens.filter(a => a.active).length;
        }

        /**
         * Draw all aliens
         */
        draw(ctx) {
            this.aliens.forEach(alien => {
                if (alien.active) {
                    alien.draw(ctx);
                }
            });
        }

        /**
         * Increase speed based on remaining aliens
         */
        adjustSpeed() {
            const remaining = this.getRemainingCount();
            const total = CONFIG.ALIEN_ROWS * CONFIG.ALIEN_COLS;
            const ratio = remaining / total;
            this.speed = CONFIG.ALIEN_START_SPEED + (1 - ratio) * CONFIG.ALIEN_SPEED_INCREMENT * 10;
        }
    }

    // ============================================
    // GAME CLASS
    // ============================================

    /**
     * Main Game class - orchestrates the entire game
     */
    class Game {
        constructor() {
            this.canvas = document.getElementById('gameCanvas');
            this.ctx = this.canvas.getContext('2d');

            // Set canvas size
            this.canvas.width = CONFIG.CANVAS_WIDTH;
            this.canvas.height = CONFIG.CANVAS_HEIGHT;

            // Initialize game state
            this.state = 'playing'; // playing, gameover, win
            this.audio = new AudioController();
            this.spriteCache = new SpriteCache();
            this.spriteCache.init(); // Pre-render all sprites
            this.stars = new Starfield(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            // Initialize entities
            this.player = new Player(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT, this.spriteCache);
            this.alienGroup = new AlienGroup(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT, this.spriteCache);

            this.bullets = [];
            this.explosions = [];

            // Game stats
            this.score = 0;
            this.lives = CONFIG.INITIAL_LIVES;

            // Input state
            this.keys = {};

            // Timing
            this.lastTime = 0;
            this.shakeTimer = 0;

            // Event listeners
            this.setupInput();

            // Start game loop
            requestAnimationFrame(this.gameLoop.bind(this));
        }

        /**
         * Setup keyboard input handling
         */
        setupInput() {
            document.addEventListener('keydown', (e) => {
                this.keys[e.code] = true;

                // Shoot with spacebar
                if (e.code === 'Space' && this.state === 'playing') {
                    e.preventDefault();
                    const bullet = this.player.shoot(performance.now());
                    if (bullet) {
                        this.bullets.push(bullet);
                        this.audio.playShoot();
                    }
                }

                // Restart with Enter
                if (e.code === 'Enter' && this.state !== 'playing') {
                    this.resetGame();
                }
            });

            document.addEventListener('keyup', (e) => {
                this.keys[e.code] = false;
            });
        }

        /**
         * Reset game to initial state
         */
        resetGame() {
            this.state = 'playing';
            this.player = new Player(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT, this.spriteCache);
            this.alienGroup = new AlienGroup(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT, this.spriteCache);
            this.bullets = [];
            this.explosions = [];
            this.score = 0;
            this.lives = CONFIG.INITIAL_LIVES;
            this.shakeTimer = 0;

            // Reinitialize audio on user interaction
            this.audio.init();
        }

        /**
         * Main game loop
         */
        gameLoop(timestamp) {
            const deltaTime = Math.min((timestamp - this.lastTime) / 1000, 0.05); // Cap deltaTime to prevent huge jumps
            this.lastTime = timestamp;

            this.update(deltaTime);
            this.draw();

            requestAnimationFrame(this.gameLoop.bind(this));
        }

        /**
         * Update game state
         */
        update(deltaTime) {
            if (this.state !== 'playing') return;

            // Update starfield
            this.stars.update();

            // Update player
            this.player.direction = 0;
            if (this.keys['ArrowLeft'] || this.keys['KeyA']) {
                this.player.direction = -1;
            }
            if (this.keys['ArrowRight'] || this.keys['KeyD']) {
                this.player.direction = 1;
            }
            this.player.update(deltaTime);

            // Update aliens
            this.alienGroup.update(deltaTime);
            this.alienGroup.moveTowardsEdge();
            this.alienGroup.adjustSpeed();

            // Update bullets
            this.bullets.forEach(bullet => bullet.update(deltaTime));
            this.bullets = this.bullets.filter(bullet => bullet.active);

            // Check bullet-alien collisions
            this.bullets.forEach(bullet => {
                const hitAlien = this.alienGroup.checkCollision(bullet);
                if (hitAlien) {
                    bullet.active = false;
                    this.score += 100;
                    this.audio.playAlienHit();
                    this.createExplosion(
                        hitAlien.x + hitAlien.width / 2,
                        hitAlien.y + hitAlien.height / 2
                    );
                }
            });
            this.bullets = this.bullets.filter(b => b.active);

            // Check player-alien collision (game over condition)
            this.alienGroup.aliens.forEach(alien => {
                if (alien.active && this.rectCollision(this.player, alien)) {
                    this.playerHit();
                }
            });

            // Check for win condition
            if (this.alienGroup.getRemainingCount() === 0) {
                this.state = 'win';
                this.audio.playWin();
            }

            // Update explosions
            this.explosions.forEach(particle => particle.update(deltaTime));
            this.explosions = this.explosions.filter(p => p.life > 0);

            // Handle screen shake
            if (this.shakeTimer > 0) {
                this.shakeTimer -= deltaTime;
            }
        }

        /**
         * Handle player being hit
         */
        playerHit() {
            this.lives--;
            this.shakeTimer = 0.3;
            this.player.hit();
            this.audio.playPlayerHit();

            // Clear nearby bullets
            this.bullets = this.bullets.filter(b => b.y < this.player.y);

            if (this.lives <= 0) {
                this.state = 'gameover';
                this.audio.playGameOver();
            }
        }

        /**
         * Create explosion effect
         */
        createExplosion(x, y) {
            for (let i = 0; i < 12; i++) {
                this.explosions.push(new ExplosionParticle(x, y, this.spriteCache));
            }
        }

        /**
         * Draw everything
         */
        draw() {
            // Clear canvas
            this.ctx.fillStyle = '#000000';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            // Apply screen shake
            this.ctx.save();
            if (this.shakeTimer > 0) {
                const shakeX = (Math.random() - 0.5) * 10;
                const shakeY = (Math.random() - 0.5) * 10;
                this.ctx.translate(shakeX, shakeY);
            }

            // Draw starfield
            this.stars.draw(this.ctx);

            // Draw game entities
            this.alienGroup.draw(this.ctx);
            this.player.draw(this.ctx);
            this.bullets.forEach(bullet => bullet.draw(this.ctx));
            this.explosions.forEach(particle => particle.draw(this.ctx));

            this.ctx.restore();

            // Draw UI
            this.drawUI();

            // Draw state screens
            if (this.state === 'gameover') {
                this.drawGameOverScreen();
            } else if (this.state === 'win') {
                this.drawWinScreen();
            }
        }

        /**
         * Draw UI elements (score, lives)
         */
        drawUI() {
            this.ctx.fillStyle = '#00ff00';
            this.ctx.font = '20px "Courier New", monospace';
            this.ctx.textAlign = 'left';
            this.ctx.fillText(`SCORE: ${this.score}`, 20, 30);

            this.ctx.textAlign = 'right';
            this.ctx.fillText(`LIVES: ${this.lives}`, this.canvas.width - 20, 30);
        }

        /**
         * Draw game over screen
         */
        drawGameOverScreen() {
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            this.ctx.fillStyle = '#ff0000';
            this.ctx.font = 'bold 60px "Courier New", monospace';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2 - 40);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '24px "Courier New", monospace';
            this.ctx.fillText(`Final Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 20);

            this.ctx.fillStyle = '#00ff00';
            this.ctx.fillText('Press ENTER to Restart', this.canvas.width / 2, this.canvas.height / 2 + 70);
        }

        /**
         * Draw win screen
         */
        drawWinScreen() {
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            this.ctx.fillStyle = '#00ff00';
            this.ctx.font = 'bold 60px "Courier New", monospace';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('YOU WIN!', this.canvas.width / 2, this.canvas.height / 2 - 40);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '24px "Courier New", monospace';
            this.ctx.fillText(`Final Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 20);

            this.ctx.fillStyle = '#ff00ff';
            this.ctx.fillText('Press ENTER to Play Again', this.canvas.width / 2, this.canvas.height / 2 + 70);
        }

        /**
         * Rectangle collision detection
         */
        rectCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
    }

    // ============================================
    // GAME INITIALIZATION
    // ============================================

    /**
     * Initialize game when DOM is ready
     */
    window.addEventListener('DOMContentLoaded', () => {
        // Create game instance
        const game = new Game();

        // Handle window resize
        window.addEventListener('resize', () => {
            // Canvas will auto-scale via CSS
        });

        // Initialize audio on first interaction
        document.addEventListener('click', () => game.audio.init(), { once: true });
        document.addEventListener('keydown', () => game.audio.init(), { once: true });
    });
    </script>
</body>
